name: Deploy Edge Functions

# Auto-deploys Supabase Edge Functions on every push to main that touches
# function code. The native Supabase↔GitHub integration was NOT deploying these
# (functions stayed on old versions after pushes), so this workflow is the
# source of truth for edge-function deploys.
#
# Requires repo secret SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level so EVERY step is authenticated (the old workflow only set it on
      # one step, so the other deploy failed auth).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a readable message instead of a confusing auth error deep
      # in the first deploy step.
      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo secret SUPABASE_ACCESS_TOKEN is not set. Create a token at
            https://supabase.com/dashboard/account/tokens and add it under
            Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Installed via npm rather than supabase/setup-cli@v1: that action resolves
      # the "latest" release through the GitHub API and failed with
      # "rate limit exceeded" on a shared runner.
      - name: Install Supabase CLI
        run: npm install -g supabase

      # Public endpoints & webhooks — must be deployed WITHOUT JWT verification.
      - name: Deploy no-JWT functions
        run: |
          for fn in generate-image-fal fal-webhook stripe-webhook stripe-checkout admin-stats admin-refund cleanup-expired-images; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref rhocpnetpxficxnrprsq --no-verify-jwt
            echo "::endgroup::"
          done

      # Functions that require a valid Supabase JWT (default behaviour).
      - name: Deploy JWT functions
        run: |
          for fn in generate-image delete-user; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref rhocpnetpxficxnrprsq
            echo "::endgroup::"
          done
